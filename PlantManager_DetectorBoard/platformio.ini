[env]
platform = atmelavr
framework = arduino

board = pro8MHzatmega328
upload_port = COM5
monitor_port = COM5
monitor_speed = 9600
lib_deps = 
    nrf24/RF24 @ ^1.4.11


; --- TEST 0: Podłączenia / piny SPI ---
[env:test0_selftest]
build_src_filter = -<*> +<test_src/test0_selftest_pins.cpp>

[env:test0_selftest_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<test_src/test0_selftest_pins.cpp>

; --- TEST 1: MCU żyje (serial + LED heartbeat) ---
[env:test1_serial]
build_src_filter = -<*> +<test_src/test1_serial_alive.cpp>

[env:test1_serial_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<test_src/test1_serial_alive.cpp>

; --- TEST 2: Czujnik Wilgotności ---
[env:test2_sensor]
build_src_filter = -<*> +<test_src/test2_sensor.cpp>

[env:test2_sensor_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<test_src/test2_sensor.cpp>

; --- TEST 3: Radio NRF24 wykrywane po SPI (bez transmisji) ---
[env:test3_nrf_chip]
build_src_filter = -<*> +<test_src/test3_nrf_chip.cpp>

[env:test3_nrf_chip_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<test_src/test3_nrf_chip.cpp>

; --- TEST 4: Radio NRF24 - właściwa transmisja (nadajnik) ---
[env:test4_nrf_link]
build_src_filter = -<*> +<test_src/test4_nrf_link.cpp>

; --- TEST 4 (UNO): Radio NRF24 na dodatkowej płytce UNO ---
[env:test4_nrf_link_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<test_src/test4_nrf_link.cpp>

; --- TEST 5: Pełny system (czujnik + radio) ze szczegółowymi logami serial ---
[env:test5_full_system]
build_src_filter = -<*> +<test_src/test5_full_system.cpp>

[env:test5_full_system_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<test_src/test5_full_system.cpp>

; --- ŚRODOWISKO PRODUKCYJNE: Pełen kod (czujnik -> nRF24) ---
[env:production]
build_src_filter = -<*> +<main.cpp> +<sensor_logic.cpp> +<low_power.cpp> +<battery.cpp>

[env:production_uno]
board = uno
upload_port = COM3
monitor_port = COM3
build_src_filter = -<*> +<main.cpp> +<sensor_logic.cpp> +<low_power.cpp> +<battery.cpp>