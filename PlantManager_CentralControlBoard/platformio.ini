[env]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Domyślna prędkość i port dla monitora oraz wgrywania na ESP8266
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200

lib_deps = 
    nrf24/RF24 @ ^1.4.11
    bblanchon/ArduinoJson @ ^7.4.2

; include/ (bsp_pins.h) nie jest domyślnie widoczne dla prywatnych bibliotek w lib/
build_flags = -Iinclude

; --- TEST 0: Podłączenia / piny SPI ---
[env:test0_selftest]
build_src_filter = -<*> +<test_src/test0_selftest_pins.cpp>

; --- TEST 1: MCU żyje (serial + LED heartbeat) ---
[env:test1_serial]
build_src_filter = -<*> +<test_src/test1_serial_alive.cpp>

; --- TEST 2: WiFi + MQTT ---
[env:test2_wifi]
build_src_filter = -<*> +<test_src/test2_wifi.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8

; --- TEST 3: Radio NRF24 wykrywane po SPI (bez transmisji) ---
[env:test3_nrf_chip]
build_src_filter = -<*> +<test_src/test3_nrf_chip.cpp>

; --- TEST 4: Radio NRF24 - odbiornik ---
[env:test4_nrf_link]
build_src_filter = -<*> +<test_src/test4_nrf_link.cpp>

; --- TEST 5: Pełny system (radio + WiFi + MQTT) ze szczegółowymi logami serial ---
[env:test5_full_system]
build_src_filter = -<*> +<test_src/test5_full_system.cpp>
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8

; --- ŚRODOWISKO PRODUKCYJNE: Pełen kod (NRF -> Wi-Fi -> HiveMQ) ---
[env:production]
build_src_filter = -<*> +<main.cpp>